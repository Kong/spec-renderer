minimumReleaseAgeExclude:
  - '@kong/*'
  - '@kong-ui/*'
  - '@kong-ui-public/*'
# When set to no-downgrade, pnpm will fail if a package's trust level has decreased compared to previous releases
trustPolicy: no-downgrade
# Ignore policy if published at least 12 days (17280 minutes)
trustPolicyIgnoreAfter: 17280
overrides:
  openapi3-ts: 4.6.1
  jsonpath-plus@<10.3.0: '>=10.4.0'
  elliptic@<=6.6.0: '>=6.6.1'
  '@babel/helpers@<7.26.10': '>=7.29.7'
  cross-spawn@>=7.0.0 <7.0.5: '>=7.0.6'
  brace-expansion@>=1.0.0 <=1.1.11: '>=2.1.4'
  brace-expansion@>=2.0.0 <=2.0.1: '>=2.1.4'
  pbkdf2@<=3.1.2: '>=3.1.6'
  sha.js@<=2.4.11: '>=2.4.12'
  cipher-base@<=1.0.4: '>=1.0.7'
  tmp@<=0.2.3: '>=0.2.7'
  js-yaml@>=4.0.0 <4.1.1: '>=4.3.1'
  glob@>=10.2.0 <10.5.0: '>=13.0.6'
  diff@>=4.0.0 <4.0.4: '>=4.0.4'
  '@isaacs/brace-expansion@<=5.0.0': '>=5.0.1'
  mdast-util-to-hast@>=13.0.0 <13.2.1: '>=13.2.1'
  qs@>=6.7.0 <=6.14.1: '>=6.15.3'
  markdown-it@>=13.0.0 <14.1.1: '>=14.3.0'
  bn.js@>=5.0.0 <5.2.3: '>=5.2.5'
  bn.js@<4.12.3: '>=5.2.5'
  rollup@>=4.0.0 <4.59.0: '>=4.62.4'
  minimatch@<10.2.3: '>=10.2.6'
  ajv@<6.14.0: ^6.15.0
  immutable@>=5.0.0 <5.1.5: '>=5.1.9'
  flatted@<=3.4.1: '>=3.4.4'
  undici@<6.24.0: '>=6.28.0'
  undici@>=7.0.0 <7.24.0: '>=7.29.0'
