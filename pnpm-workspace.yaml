  vite@>=7.0.0 <=7.3.1: '>=7.3.6'
  form-data@>=4.0.0 <4.0.6: ^4.0.6
strictPeerDependencies: false
allowBuilds:
  '@evilmartians/lefthook': true
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
