name: Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main

  # Allow calling manually from GitHub
  workflow_dispatch:

  # Allow workflow to be called by another workflow
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.SPEC_RENDERER_BOT_PAT }}

    steps:
      - name: Remove preview consumption comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr_preview_consumption
          delete: true
          GITHUB_TOKEN: ${{ secrets.SPEC_RENDERER_BOT_PAT }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup PNPM with Dependencies
        uses: ./.github/actions/setup-pnpm-with-dependencies/
        with:
          force-install: true

      - name: Stylelint
        run: pnpm run stylelint

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: |
          pnpm run build

      - name: Test
        run: pnpm run test


      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-artifact
        with:
          name: spec-renderer-build-output-artifact
          path: ./dist/**
          include-hidden-files: 'true'
          if-no-files-found: error

      - name: Prepare preview publish
        id: prepare-preview
        run: |
          echo "preid=pr.${{ github.event.pull_request.number }}.$(git rev-parse --short ${{ github.event.pull_request.head.sha }})" >> $GITHUB_OUTPUT

      - name: Dispatch preview publish
        if: |
          github.event_name == 'pull_request' &&
          (github.actor != 'renovate[bot]' || contains(github.event.pull_request.labels.*.name, 'create preview package'))
        uses: the-actions-org/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # v4
        with:
          workflow: npmjs.yaml
          token: ${{ secrets.SPEC_RENDERER_BOT_PAT }}
          inputs: '{ "action": "publish-preview", "build-artifact": "spec-renderer-build-output-artifact", "run-id": "${{ github.run_id }}", "preview-pre-id": "${{steps.prepare-preview.outputs.preid}}", "preview-tag": "pr-${{ github.event.pull_request.number }}", "preview-pr-number" : "${{ github.event.pull_request.number }}" }'
          wait-for-completion: true
          ref: ${{ github.head_ref || github.ref_name }}

