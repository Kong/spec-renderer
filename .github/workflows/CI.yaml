name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write

jobs:
  remove-prev-comments:
    name: Remove PR preview comments
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:
      - name: Remove preview consumption comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr_preview_consumption
          delete: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-tests:
    name: Tests
    uses: ./.github/workflows/test.yaml

  publish-preview:
    name: Publish Preview
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    steps:

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PNPM with Dependencies
        uses: ./.github/actions/setup-pnpm-with-dependencies/

      - name: Download Build Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: spec-renderer-build-output-artifact
          path: ./dist

      - name: Setup git
        run: |
          git config --global user.email "konnectx-engineers+kongponents-bot@konghq.com"
          git config --global user.name 'kong-bot'

      - name: Publish Package Preview
        id: package-preview
        # Do not run for `alpha` or `beta` branches
        if: github.event_name == 'pull_request' && (github.actor != 'renovate[bot]' || contains(github.event.pull_request.labels.*.name, 'create preview package')) && !contains(github.head_ref || github.ref_name, 'alpha') && !contains(github.head_ref || github.ref_name, 'beta')
        run: |

          preid="pr.${{ github.event.pull_request.number }}.$(git rev-parse --short ${{ github.event.pull_request.head.sha }})"
          tag="pr-${{ github.event.pull_request.number }}"
          echo "preid=${preid}"

          # Use pnpm to bump the version for the prerelease
          pnpm version prerelease --preid ${preid} --no-git-tag-version --yes

          package_version=$(jq -r ".version" package.json)
          package=@kong/spec-renderer@"${package_version}"

          npm show "${package}" >/dev/null 2>&1 && npm_show_status=0 || npm_show_status=1
          if [ $npm_show_status -eq 0 ]; then
            echo "Package ${package} is already published. Skipping publishing."
            exit 0
          fi

          npm_instructions=""

          pnpm publish --no-git-checks --access public --tag "${tag}"

          if [ $? -ne 0 ]; then
            echo "Error publishing package"
            exit -1
          fi

          package_name=$(jq -r ".name" package.json)
          npm_instructions="${package_name}@${tag}"

          echo "npm_instructions<<EOF" >> $GITHUB_OUTPUT
          echo -e "$npm_instructions" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Provide preview link info
        if: ${{ steps.package-preview.outputs.npm_instructions != '' }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr_preview_consumption
          message: |
             ### Install the preview package from this PR

             ```sh
             ${{ steps.package-preview.outputs.npm_instructions }}
             ```
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [run-tests]
    if: github.event_name == 'push'
    timeout-minutes: 20
    # Re-declared perms since this job needs contents: write, and perms are not merged with the top-level block but instead replaced
    permissions:
      id-token: write
      contents: write
      actions: read
      pull-requests: write

    steps:
      - name: Generate Kong token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token-kong
        with:
          client-id: ${{ vars.CORE_UI_GH_APP_READ_ID }}
          private-key: ${{ secrets.CORE_UI_GH_APP_READ_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token-kong.outputs.token }}
          fetch-depth: 0

      - name: Setup PNPM with Dependencies
        uses: ./.github/actions/setup-pnpm-with-dependencies/

      - name: Setup git
        run: |
          git config --global user.email "konnectx-engineers+kongponents-bot@konghq.com"
          git config --global user.name 'kong-bot'


      - name: Download Build Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: spec-renderer-build-output-artifact
          path: ./dist

      - name: Semantic Release
        if: github.event_name == 'push'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          # Since branch protections are on (pushing commits) you need to use a app token
          GITHUB_TOKEN: ${{ steps.app-token-kong.outputs.token }}
