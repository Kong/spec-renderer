name: Cleanup PR preview packages
on:
  workflow_dispatch:

  schedule:
    - cron: '0 2/6 * * 6,0'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  id-token: write  # Required for OIDC
  contents: read
  actions: read

jobs:
  cleanup:
    name: Cleanup PR Previews
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Dispatch preview publish
        uses: the-actions-org/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # v4
        with:
          workflow: npmjs.yaml
          token: ${{ secrets.SPEC_RENDERER_BOT_PAT }}
          inputs: '{ "action": "cleanup-previews" }'
          wait-for-completion: true
          ref: ${{ github.head_ref || github.ref_name }}


