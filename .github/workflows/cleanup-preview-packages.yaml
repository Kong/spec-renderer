name: Cleanup PR preview packages
on:
  workflow_dispatch:

  schedule:
    - cron: '0 2/6 * * 6,0'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup PR Previews
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.SPEC_RENDERER_BOT_PAT }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dispatch preview cleanup
        id: prepare
        run: |
          gh workflow run npmjs.yaml --ref ${{ github.head_ref || github.ref_name }} -f action=cleanup-previews -f run_id=${{github.event.inputs.id}}

